<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedyRebuilds | Premium Website Rebuilds for Service Businesses</title>
    <meta name="description" content="SpeedyRebuilds modernizes outdated business websites into fast, high-trust lead generation systems.">
    <meta property="og:title" content="SpeedyRebuilds | Premium Website Rebuilds">
    <meta property="og:description" content="Modern websites engineered for conversion, speed, and trust.">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --line: #d9e0ea;
            --brand-1: #0891b2;
            --brand-2: #14b8a6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Manrope', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        h1, h2, h3, h4, h5 {
            font-family: 'Sora', sans-serif;
            letter-spacing: -0.02em;
        }

        .brand-gradient {
            background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
        }

        .brand-gradient-text {
            background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .panel {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--line);
            box-shadow: 0 24px 56px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(10px);
        }

        .section-kicker {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: #0e7490;
            margin: 0;
        }

        .section-title {
            margin-top: 0.7rem;
            margin-bottom: 0;
            font-size: clamp(1.9rem, 3.8vw, 3.4rem);
            line-height: 1.03;
            font-weight: 800;
            color: #0f172a;
        }

        .ambient-grid {
            background-image:
              linear-gradient(to right, rgba(148, 163, 184, 0.1) 1px, transparent 1px),
              linear-gradient(to bottom, rgba(148, 163, 184, 0.1) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.45;
        }

        .glow-orb {
            position: absolute;
            border-radius: 999px;
            filter: blur(72px);
            opacity: 0.28;
            background: radial-gradient(circle at 40% 40%, #22d3ee 0%, #2dd4bf 60%, transparent 72%);
        }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "framer-motion": "https://esm.sh/framer-motion@10.16.4?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@0.284.0?external=react,react-dom",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
